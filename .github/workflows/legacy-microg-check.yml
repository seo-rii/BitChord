name: Legacy microG discovery

on:
  push:
    branches: [feat/android-microg]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-microg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-account-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download and verify the original Team Vanced microG release
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/vanced-microg.apk" \
            'https://github.com/TeamVanced/VancedMicroG/releases/download/v0.2.24.220220-220220001/microg.apk'
          cd "$RUNNER_TEMP"
          echo 'e5ce4f9759d3e70ac479bf2d0707efe5a42fca8513cf387de583b8659dbfbbbf  vanced-microg.apk' | sha256sum --check
      - name: Reserve space for the Android build and emulator
        run: |
          if [ "$(df --output=avail -k "$GITHUB_WORKSPACE" | tail -1)" -lt 20971520 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/.ghcup
          fi
      - name: Assemble the debug app and test APKs
        run: bash ./gradlew --max-workers=2 :app:assembleDevDebug :app:assembleDevDebugAndroidTest
      - name: Allow the hosted runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify authenticator discovery from BitChord
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          ram-size: 2048M
          script: |
            adb install "$RUNNER_TEMP/vanced-microg.apk"
            bash ./gradlew --max-workers=2 :app:connectedDevDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.music.bitchord.auth.LegacyMicroGDiscoveryTest -Pandroid.testInstrumentationRunnerArguments.verifyLegacyMicroG=true
      - name: Check the device actually ran the discovery test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          reports = Path("app/build/outputs/androidTest-results/connected")
          matches = [
              test for report in reports.rglob("*.xml")
              for test in ElementTree.parse(report).iter("testcase")
              if test.get("classname") == "com.music.bitchord.auth.LegacyMicroGDiscoveryTest"
          ]
          if len(matches) != 1 or any(matches[0].find(tag) is not None for tag in ("skipped", "failure", "error")):
              raise SystemExit("Expected one passing LegacyMicroGDiscoveryTest on the emulator")
          PY
