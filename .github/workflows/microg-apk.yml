name: Android microG APK

on:
  push:
    branches: [feat/android-microg]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-microg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already provides ANDROID_HOME; use BitChord's upstream
      # setup pattern. setup-android@v3 currently fails on sdkmanager 'tools'.
      - uses: gradle/actions/setup-gradle@v4
      # Native source is public and pinned. This compiles the userspace tunnel
      # into the SAME APK; no Morphe patcher, prebuilt VPN app or VpnService.
      - name: Checkout pinned WireGuard userspace source
        uses: actions/checkout@v4
        with:
          repository: seo-rii/morphe-patches
          ref: d03b7439f517eeed13d12edc1f922ee0e640cd13
          path: wireguard-source
          sparse-checkout: |
            native/wireguard
            scripts/build-wireguard-android.sh
            LICENSE
            NOTICE
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install native Android NDK r28c
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
      - name: Build embedded WireGuard (arm64-v8a and x86_64)
        run: |
          test "$(git -C wireguard-source rev-parse HEAD)" = d03b7439f517eeed13d12edc1f922ee0e640cd13
          # Hosted runners may set ANDROID_NDK_HOME to an older NDK.
          # The native script prioritizes that variable over ANDROID_HOME,
          # so force the installed r28c path instead of accepting a mismatch.
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          test -f "$ANDROID_NDK_HOME/source.properties"
          sed -n '/Pkg.Revision/p' "$ANDROID_NDK_HOME/source.properties"
          bash wireguard-source/scripts/build-wireguard-android.sh arm64-v8a x86_64
          for abi in arm64-v8a x86_64; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "wireguard-source/native/wireguard/build/android/$abi/libmorphewireguard.so" "app/src/main/jniLibs/$abi/"
            test -s "app/src/main/jniLibs/$abi/libmorphewireguard.so"
          done
          mkdir -p app/src/main/assets/wireguard/licenses
          cp wireguard-source/LICENSE wireguard-source/NOTICE app/src/main/assets/wireguard/licenses/
          cp -a wireguard-source/native/wireguard/licenses/. app/src/main/assets/wireguard/licenses/
      - name: Restore configured development signer
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            install -d -m 700 ~/.android
            umask 077
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          fi
      - name: Check account sessions and request signing
        run: |
          bash ./gradlew :shared:jvmTest --tests '*MicroGRequestTest' --tests '*AppProxyRouteTest' \
            :app:testDevDebugUnitTest \
            --tests 'com.music.bitchord.AccountSessionsTest' \
            --tests 'com.music.bitchord.auth.MicroGConsentFlowTest' \
            --tests 'com.music.bitchord.AuthCookieTest'
      - name: Assemble optimized phone APKs
        run: bash ./gradlew :app:assembleDevOptimized
      - name: Verify APK signatures and bundled WireGuard libraries
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          mkdir distribution
          for abi in arm64-v8a x86_64; do
            apk="app/build/outputs/apk/dev/optimized/app-dev-${abi}-optimized.apk"
            unzip -t "$apk" "lib/$abi/libmorphewireguard.so"
            "$apksigner" verify --verbose --print-certs "$apk" > "distribution/$abi-signature.txt"
            cp "$apk" "distribution/BitChord-microG-$abi.apk"
          done
          (cd distribution && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-microG-APK
          path: distribution/*
          if-no-files-found: error
          retention-days: 30
